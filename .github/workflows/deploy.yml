
name: Deploy AInvoker API

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ainvoker-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            source ~/.nvm/nvm.sh
            nvm use 24

            cd /var/www/ainvoker-api

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npx prisma generate
            npm run build

            pm2 restart ainvoker-api --update-env

            echo "AInvoker API deployed successfully"